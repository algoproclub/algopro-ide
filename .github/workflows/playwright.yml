name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-20.04
    steps:
      - name: Free up space
        run: |
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/bake-action@master
        with:
          push: false
          load: true
          files: |-
            docker-compose.yml
            docker-compose.test.yml
          set: |
            functions.cache-from=type=gha,scope=cached-functions
            functions.cache-to=type=gha,mode=max,scope=cached-functions
            firebase.cache-from=type=gha,scope=cached-firebase
            firebase.cache-to=type=gha,mode=max,scope=cached-firebase
            yjs.cache-from=type=gha,scope=cached-yjs
            yjs.cache-to=type=gha,mode=max,scope=cached-yjs
            execute.cache-from=type=gha,scope=cached-execute
            execute.cache-to=type=gha,mode=max,scope=cached-execute
            web.cache-from=type=gha,scope=cached-web
            web.cache-to=type=gha,mode=max,scope=cached-web
            playwright.cache-from=type=gha,scope=cached-playwright
            playwright.cache-to=type=gha,mode=max,scope=cached-playwright

      - name: run tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up --exit-code-from playwright

      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
