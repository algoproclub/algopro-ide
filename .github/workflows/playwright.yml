name: Playwright Tests
on:
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3

      - uses: KengoTODA/actions-setup-docker-compose@v1
        with:
          version: '2.24.6'

      - name: run tests
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml up --build --exit-code-from playwright

      - uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
