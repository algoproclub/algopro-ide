name: Staging

on:
  push:
    branches:
      - master

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    env:
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: cd functions && npm install

      - name: Authenticate with Firebase
        shell: bash
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"

      - name: Deploy
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CF_API_SECRET: ${{ secrets.CF_API_SECRET }}
          LOGIN_BOT_URL: ${{ secrets.LOGIN_BOT_URL }}
        run: |
          # Create .env file for Firebase Functions params
          echo "CF_API_KEY=$CF_API_KEY" >> functions/.env
          echo "DEEPL_API_KEY=$DEEPL_API_KEY" >> functions/.env
          echo "OPENAI_API_KEY=$OPENAI_API_KEY" >> functions/.env
          echo "CF_API_SECRET=$CF_API_SECRET" >> functions/.env
          echo "LOGIN_BOT_URL=$LOGIN_BOT_URL" >> functions/.env

          firebase deploy --project "algopro-app-staging" --non-interactive --force
