name: Deploy to Vercel

on:
  workflow_dispatch:

jobs:
  createPullRequest:
    runs-on: ubuntu-latest

    steps:
      # Get the production branch
      - uses: actions/checkout@v4
        with:
          ref: production

      # Fetch master branch
      - name: Fetch master branch
        run: git fetch origin master:master

      # Rebase master onto production with rewritten author
      - name: Rebase commits with rewritten author
        run: |
          git checkout -b production-promotion master
          git rebase --onto production production master --exec 'git commit --amend --author="AlgoPro <info@algopro.hu>" --no-edit'

      # Push rebased branch
      - name: Push rebased branch
        run: |
          git push origin production-promotion --force

      - name: create pull request to promote to production
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.VERCEL_IDE_DEPLOY_TOKEN }}
          branch: "production-promotion"
          title: 'Deploy to Production'
          committer: 'AlgoPro <info@algopro.hu>'
