name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # CHeck out defult branhc
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Vercel creds
      - name: Set up Git
        run: |
          git config user.name "AlgoPro"
          git config user.email "info@algopro.hu"

      # Get all brances
      - name: Fetch relevant branches
        run: |
          git fetch origin master:master
          git fetch origin production:production

      # Create production-update branch
      - name: Create production-update branch
        run: |
          git checkout production
          git checkout -b production-update

      # Merge and squash changes from main authored by the Vercel account
      - name: Merge and squash changes from main
        run: |
          git merge --squash origin/master
          git commit -m "Deploy to production"

      # Update the pullrequest base
      - name: Push production-update branch
        run: git push origin production-update --force

      # Create pullrequest
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v4
        with:
          token: ${{ secrets.VERCEL_IDE_DEPLOY_TOKEN }}
          branch: production-update
          committer: 'AlgoPro <info@algopro.hu>'
          title: 'Deploy to Production'
          body: 'This PR contains the latest changes from main to be deployed to production.'
          base: production
