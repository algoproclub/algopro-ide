version: '3'
services:
  functions:
    build:
      context: .
      dockerfile: functions.Dockerfile
    volumes:
      - type: bind
        source: .
        target: /app/
  firebase:
    build:
      context: .
      dockerfile: firebase.Dockerfile
    ports:
      - '4000:4000' # emulator suite UI
      - '5001:5001' # functions
      - '8080:8080' # firestore
      - '9000:9000' # realtime database
      - '9099:9099' # auth
      - '9150:9150' # firestore requests (for emulator suite UI)
      - '9199:9199' # storage
    volumes:
      - type: bind
        source: functions/
        target: /app/functions
      - './.firebaserc:/app/.firebaserc'
      - './firebase.json:/app/firebase.json'
      - './firestore.rules:/app/firestore.rules'
      - './database.rules.json:/app/database.rules.json'
      - './storage.rules:/app/storage.rules'
      - data:/data
    depends_on: [functions]
  yjs:
    build:
      context: .
      dockerfile: yjs.Dockerfile
    ports:
      - '1234:1234'
    environment:
      - FIREBASE_STORAGE_EMULATOR_HOST=firebase:9199
      - FIREBASE_AUTH_EMULATOR_HOST=firebase:9099
      - FIRESTORE_EMULATOR_HOST=firebase:8080
      - DATABASE_PATH=/data/db.sqlite
      - SECURITY_KEY=example-yjs-security-key
    volumes:
      - data:/data
    depends_on:
      firebase:
        condition: service_started
  execute:
    build:
      context: execute
    environment:
      - EXECUTE_DUMMY=true
      - FIREBASE_AUTH_EMULATOR_HOST=firebase:9099
      - FIREBASE_PROJECT_IDS=algopro-app
      - EXECUTE_ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - '127.0.0.1:1235:1235'
    volumes:
      - type: bind
        source: execute/
        target: /app
    depends_on:
      firebase:
        condition: service_started
  login-bot:
    build:
      context: login-bot
    ports:
      - '3100:3100'
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - FIREBASE_STORAGE_EMULATOR_HOST=firebase:9199
      - FIREBASE_AUTH_EMULATOR_HOST=firebase:9099
      - FIRESTORE_EMULATOR_HOST=firebase:8080
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - NEXT_PUBLIC_EXECUTE_URL=http://localhost:1235
      - NEXT_PUBLIC_YJS_URL=ws://localhost:1234
      - YJS_API_URL=http://yjs:1234
      - YJS_SECURITY_KEY=example-yjs-security-key
      - LOGIN_BOT_URL=http://login-bot:3100
      - NEXT_PUBLIC_LSP_URL=${NEXT_PUBLIC_LSP_URL}
      - BOT_AUTH_SIGNATURE_AGENT="https://ide.algopro.hu"
      - BOT_AUTH_USER_AGENT=AlgoProBot
    ports:
      - '3000:3000'
      - '127.0.0.1:9229:9229'
    volumes:
      - type: bind
        source: .
        target: /app/
      - type: volume
        source: next-cache
        target: /app/.next/
      - type: volume
        target: /app/node_modules
    depends_on:
      yjs:
        condition: service_started
      execute:
        condition: service_started
volumes:
  data:
  next-cache:
