version: '3'
services:
  functions:
    build:
      context: .
      dockerfile: functions.Dockerfile
    volumes:
      - type: bind
        source: .
        target: /app/
  firebase:
    build:
      context: .
      dockerfile: firebase.Dockerfile
    ports:
      - '4000:4000' # emulator suite UI
      - '5001:5001' # functions
      - '8080:8080' # firestore
      - '9000:9000' # realtime database
      - '9099:9099' # auth
      - '9150:9150' # firestore requests (for emulator suite UI)
      - '9199:9199' # storage
    volumes:
      - type: bind
        source: functions/
        target: /app/functions
      - './.firebaserc:/app/.firebaserc'
      - './firebase.json:/app/firebase.json'
      - './firestore.rules:/app/firestore.rules'
      - './database.rules.json:/app/database.rules.json'
      - './storage.rules:/app/storage.rules'
    depends_on: [functions]
  yjs:
    build:
      context: .
      dockerfile: yjs.Dockerfile
    ports:
      - '1234:1234'
  execute:
    build:
      context: execute
    environment:
      - EXECUTE_DUMMY=true
    ports:
      - '1235'
  login-bot:
    build:
      context: login-bot
    ports:
      - '3100:3100'
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - FIRESTORE_EMULATOR_HOST=firebase:8080
      - FIREBASE_DATABASE_EMULATOR_HOST=firebase:9000
      - FIREBASE_AUTH_EMULATOR_HOST=firebase:9099
      - FIREBASE_STORAGE_EMULATOR_HOST=firebase:9199
    ports:
      - '3000:3000'
      - '127.0.0.1:9229:9229'
    volumes:
      - type: bind
        source: src/
        target: /app/src
      - type: bind
        source: public/
        target: /app/public
      - type: bind
        source: pages/
        target: /app/pages
      - type: bind
        source: patches/
        target: /app/patches
    depends_on:
      yjs:
        condition: service_started
      execute:
        condition: service_started
